<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Best Sister 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(#dbe9ff, #f2f6ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.card {
  background: white;
  width: 360px;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.15);
  z-index: 10;
}

.emoji {
  font-size: 60px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  position: relative;
}

button {
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #4f7cff;
  color: white;
}

.no {
  background: #e0e0e0;
  position: relative;
}

.note {
  margin-top: 15px;
  font-size: 12px;
  color: #666;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.heart {
  position: absolute;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { bottom: -10px; opacity: 1; }
  100% { bottom: 110%; opacity: 0; }
}

.photo {
  width: 160px;
  height: auto;
  border-radius: 15px;
  margin: 15px 0;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="card">

  <!-- PAGE 1 -->
  <div class="page active" id="page-question">
    <div class="emoji">👧💙</div>
    <h2>Hey bro 😎</h2>
    <p>Do you agree that you got the **best sister ever**?</p>

    <div class="buttons" id="btnContainer">
      <button class="yes" id="yesBtn">Obviously 😌</button>
      <button class="no" id="noBtn">Hmm…</button>
    </div>

    <div class="note">Careful… wrong answer 😈</div>
  </div>

  <!-- PAGE 2 - YES -->
  <div class="page" id="page-yes">
    <div class="emoji">🎉🏆</div>
    <h2>Correct!</h2>
    <p>You are officially blessed with the **best sister in the world** 💖</p>
    <img src="valentine1.jpeg" class="photo" alt="Best sister">
  </div>

  <!-- PAGE 3 - NO -->
  <div class="page" id="page-no">
    <div class="emoji">😏💥</div>
    <h2>Wrong answer 😌</h2>
    <p>But don’t worry…</p>
    <p>You still got the **best sister** anyway 💙</p>
    <img src="valentine2.jpeg" class="photo" alt="Best sister anyway">
    <button onclick="goBack()">Try Again 😄</button>
  </div>

</div>

<script>
function showPage(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
}

document.getElementById("yesBtn").addEventListener("click", () => {
  showPage("page-yes");
});

const noBtn = document.getElementById("noBtn");
const container = document.getElementById("btnContainer");

let noClicked = false;

noBtn.addEventListener("mouseover", () => {
  if (noClicked) return;

  const x = Math.random() * (container.offsetWidth - noBtn.offsetWidth);
  const y = Math.random() * (container.offsetHeight - noBtn.offsetHeight);

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

noBtn.addEventListener("click", () => {
  noClicked = true;
  showPage("page-no");
});

function goBack() {
  showPage("page-question");
}

setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
